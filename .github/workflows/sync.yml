name: Sync

# Each release of the library reaches every repository that runs a copy of
# it, and nothing else does. A release waits for the owner's approval in
# the environment release (.github/workflows/release.yml), and the sync
# carries only a published release: it runs when a run of the Release
# workflow completes, weekly and by hand, and every run carries the newest
# published release, never main's head, so neither a run by hand nor the
# schedule is a way around that approval. The release counts only where
# its tag stands at the commit that raised main's first-parent line to its
# version, where release.yml makes it, and the sync checks out that commit,
# never the tag by its name, which a branch of the same name would take
# the place of. Release publishes with GITHUB_TOKEN, whose events start no
# workflow, so the sync follows the Release run itself (workflow_run)
# rather than the release it published, and goes on only after a Release
# run that concluded success and that main started, by a push or by hand,
# never one that a pull request, a fork's above all, could start.
#
# For each consumer the release's own ecosystem.json lists, the job sync
# makes the copy with the release's own scripts/vendor.py, from the
# release's package, in a checkout of that consumer and, when anything
# changed, pushes the result to the branch symphony-protocol/sync there and
# opens the pull request from it, or updates the one already open; where
# ecosystem.json gives the consumer auto_merge it then arms auto-merge, so
# the consumer's own required check is the last word. The pull request's
# words are main's scripts/sync.py's, which reads the release's
# ecosystem.json and history. The commits and pull requests are the GitHub
# App OpenSpine Symphony's, with a token scoped to the one consumer and to
# the two permissions the job uses: a push made with GITHUB_TOKEN starts no
# workflow in the consumer, and the App's does, so the consumer's CI runs
# on it. The branch belongs to this workflow alone, which is why it is
# force-pushed; it is pushed only when the copy differs from what the
# branch already holds, so a run with nothing new never restarts the
# consumer's CI. When the consumer's main already holds the copy, a sync
# pull request still open there is stale, and the job closes it.
#
# A run started by hand from another branch says so in its summary and
# stops, so a branch nobody reviewed never runs with the App's key. Where
# the variable SDLC_APP_ID is not set, the plan says in the run's summary
# what the owner sets up (README.md, "The owner's one-time setup for the
# sync") and the sync is skipped, so the run stays green; so it is when no
# release is published yet, or the Release run before it published none.
# Values reach a shell only through env:, never through an expression
# inside run:, so nothing a value holds runs as code. One sync runs at a
# time and a newer one waits for it rather than cancelling it, so a
# consumer's pull request is never left half made. The weekly run catches
# a release whose sync failed, or a consumer that moved its copy by hand.

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.consumers.outputs.matrix }}
      enabled: ${{ steps.plan.outputs.enabled }}
      tag: ${{ steps.plan.outputs.tag }}
      commit: ${{ steps.plan.outputs.commit }}
    steps:
      # Main's whole first-parent line and every tag, to find where the
      # newest release's tag stands.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # A Release run's completion and the schedule run on the default
      # branch, main; only a run by hand can name another ref, and that one
      # stops. The releases are listed as GitHub publishes them, drafts and
      # prereleases left out, and the newest is the highest version. Its
      # tag counts only where release.yml makes one, at the commit that
      # raised main's first-parent line to its version (scripts/release.py),
      # and a tag anywhere else, a release published by hand or a tag moved
      # after its release, stops the run, red, carrying nothing. From here
      # on the release is that commit, never the tag's name, which a branch
      # of the same name would take the place of in a checkout.
      - name: Choose the release to carry, and whether the sync may run
        id: plan
        env:
          APP_ID: ${{ vars.SDLC_APP_ID }}
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.ref }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          if [ "$REF" != "refs/heads/main" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            python3 scripts/sync.py off-main --ref "$REF" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$EVENT" = "workflow_run" ]; then
            why="$(python3 scripts/sync.py after-release "$GITHUB_EVENT_PATH" --repository "$REPO")"
            if [ -n "$why" ]; then
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              printf '%s\n' "$why" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi
          if [ -z "$APP_ID" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            python3 scripts/sync.py setup >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          tags="$RUNNER_TEMP/tags.txt"
          gh api --paginate "repos/$REPO/releases?per_page=100" \
            --jq '.[] | select((.draft or .prerelease) | not) | .tag_name' > "$tags"
          tag="$(python3 scripts/sync.py newest-release < "$tags")"
          if [ -z "$tag" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            python3 scripts/sync.py no-release >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          commit="$(git rev-parse --verify -q "refs/tags/$tag^{commit}" || true)"
          why="$(python3 scripts/sync.py misplaced --tag "$tag" --commit "$commit")"
          if [ -n "$why" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            printf '%s\n' "$why" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          python3 scripts/sync.py carrying --tag "$tag" --commit "$commit" >> "$GITHUB_STEP_SUMMARY"

      # The release's own ecosystem.json says which consumers take it. A
      # run that stops lists none: GitHub reads the job sync's if before
      # its matrix, so that job is skipped without one.
      - uses: actions/checkout@v7
        if: steps.plan.outputs.enabled == 'true'
        with:
          ref: ${{ steps.plan.outputs.commit }}
          path: release
          persist-credentials: false

      - name: List the consumers the release names
        id: consumers
        if: steps.plan.outputs.enabled == 'true'
        run: |
          set -eu
          matrix="$(python3 scripts/sync.py --library release matrix)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  sync:
    name: sync (${{ matrix.name }})
    needs: plan
    if: needs.plan.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      CONSUMER: ${{ matrix.repository }}
      AUTO_MERGE: ${{ matrix.auto_merge }}
      BRANCH: symphony-protocol/sync
    steps:
      # This repository at the workflow's own commit, main's, for
      # scripts/sync.py, which writes the pull request; nothing is pushed
      # from it.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The release the plan chose, by its commit, with its whole history:
      # its own scripts/vendor.py makes the copy, so the files, the record
      # and the version a consumer gets are the release's, and the pull
      # request's body lists the library's commits since the one the
      # consumer's copy names.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.commit }}
          path: release
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # An empty commit would have left the checkout above at this run's
      # own commit, main's head, so the leg goes on only when the checkout
      # is the commit the plan chose and the release's tag still names it,
      # before the App's key is used.
      - name: Go on only with the commit of the release the plan chose
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          COMMIT: ${{ needs.plan.outputs.commit }}
        run: |
          set -eu
          head="$(git -C release rev-parse HEAD)"
          tagged="$(git -C release rev-parse --verify -q "refs/tags/$TAG^{commit}" || true)"
          if ! [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]] || [ "$head" != "$COMMIT" ] || [ "$tagged" != "$COMMIT" ]; then
            echo "Nothing was vendored: the plan chose ${TAG:-no release} at ${COMMIT:-no commit}, and this checkout is at $head, with that tag at ${tagged:-no commit}." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      # Contents to push the branch, pull requests to open, edit, close
      # and arm one; the installation's other permissions stay out.
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ vars.SDLC_APP_ID }}
          private-key: ${{ secrets.SDLC_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ matrix.name }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@v7
        with:
          repository: ${{ matrix.repository }}
          token: ${{ steps.app-token.outputs.token }}
          path: consumer

      - name: Vendor the release into the consumer
        run: python3 release/scripts/vendor.py consumer --consumer "$CONSUMER"

      # The App's bot is the author, as GitHub shows the App's own pushes.
      - name: Who the App commits as
        id: bot
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          id="$(gh api "/users/${SLUG}[bot]" --jq .id)"
          echo "name=${SLUG}[bot]" >> "$GITHUB_OUTPUT"
          echo "email=${id}+${SLUG}[bot]@users.noreply.github.com" >> "$GITHUB_OUTPUT"

      - name: Open, update or close the consumer's pull request
        working-directory: consumer
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BOT_NAME: ${{ steps.bot.outputs.name }}
          BOT_EMAIL: ${{ steps.bot.outputs.email }}
        run: |
          sync="python3 $GITHUB_WORKSPACE/scripts/sync.py --library $GITHUB_WORKSPACE/release"
          report() { $sync summary --consumer "$CONSUMER" "$@" | tee -a "$GITHUB_STEP_SUMMARY"; }

          # The sync's own open pull request. gh's --head matches the
          # branch's name alone, whatever repository the head is in, so a
          # pull request from a fork whose branch has the same name is
          # listed too: that one is someone else's, and is left alone.
          own_pull() {
            gh pr list --repo "$CONSUMER" --head "$BRANCH" --state open --json url,isCrossRepository \
              --jq '[.[] | select(.isCrossRepository | not)][0].url // ""'
          }

          # Whether the branch already holds this very tree on this very
          # base, when a push would only restart the consumer's CI on the
          # same files.
          already_pushed() {
            git fetch -q --depth=2 origin "refs/heads/$BRANCH" 2> /dev/null || return 1
            [ "$(git rev-parse 'FETCH_HEAD^{tree}')" = "$(git write-tree)" ] &&
              [ "$(git rev-parse 'FETCH_HEAD^')" = "$(git rev-parse HEAD)" ]
          }

          # Whether the open pull request already reads as this run would
          # write it, when an edit would only restart a CI that runs on
          # edits.
          reads_the_same() {
            [ "$(gh pr view "$1" --json title,body --jq '.title + "\n" + .body')" = \
              "$(printf '%s\n' "$title"; cat "$RUNNER_TEMP/body.md")" ]
          }

          # Arm auto-merge and never merge. gh pr merge --auto merges at once
          # a pull request GitHub does not count as blocked, which on a
          # consumer whose main requires no check would land the copy
          # before its check has run; this mutation only arms it, and
          # GitHub refuses it where nothing is left to wait for.
          arm_auto_merge() {
            local pull id armed
            pull="$(gh pr view "$1" --json id,autoMergeRequest --jq '"\(.id) \(.autoMergeRequest != null)"')" || return 1
            read -r id armed <<< "$pull"
            [ "$armed" = "true" ] && return 0
            gh api graphql -f id="$id" -f query='mutation($id: ID!) {
              enablePullRequestAutoMerge(input: {pullRequestId: $id, mergeMethod: MERGE}) { clientMutationId } }' > /dev/null
          }

          url="$(own_pull)"
          if [ -z "$(git status --porcelain)" ]; then
            # main here already holds this copy, so a sync pull request
            # still open has nothing left to land.
            if [ -n "$url" ]; then
              gh pr close "$url" --comment "$($sync closing --consumer "$CONSUMER")"
              report --state closed --url "$url"
            else
              report --state "up to date"
            fi
            exit 0
          fi

          base="$(git rev-parse --abbrev-ref HEAD)"
          $sync body . --consumer "$CONSUMER" > "$RUNNER_TEMP/body.md"
          $sync message . --consumer "$CONSUMER" > "$RUNNER_TEMP/message.txt"
          title="$($sync title . --consumer "$CONSUMER")"
          git checkout -q -B "$BRANCH"
          git add -A
          pushed="no"
          if ! already_pushed; then
            git -c user.name="$BOT_NAME" -c user.email="$BOT_EMAIL" commit -q -F "$RUNNER_TEMP/message.txt"
            git push --force origin "HEAD:refs/heads/$BRANCH"
            pushed="yes"
          fi

          if [ -z "$url" ]; then
            url="$(gh pr create --repo "$CONSUMER" --base "$base" --head "$BRANCH" --title "$title" --body-file "$RUNNER_TEMP/body.md")"
            state="opened"
          elif [ "$pushed" = "no" ] && reads_the_same "$url"; then
            state="unchanged"
          else
            gh pr edit "$url" --title "$title" --body-file "$RUNNER_TEMP/body.md"
            state="updated"
          fi

          merge=""
          reason=""
          if [ "$AUTO_MERGE" = "true" ]; then
            if arm_auto_merge "$url" 2> "$RUNNER_TEMP/auto-merge.txt"; then
              merge="on"
            else
              merge="refused"
              reason="$(head -c 400 "$RUNNER_TEMP/auto-merge.txt")"
            fi
          fi
          report --state "$state" --url "$url" --auto-merge "$merge" --reason "$reason"
