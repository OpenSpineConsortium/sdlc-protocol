name: Sync

# One push to main that changes the package reaches every repository that
# runs a copy of it. For each consumer ecosystem.json lists, the job sync
# vendors main into a checkout of that consumer with scripts/vendor.py and,
# when anything changed, pushes the result to the branch
# sdlc-protocol/sync there and opens the pull request from it, or updates
# the one already open; on a public consumer it then turns on auto-merge,
# so the consumer's own required check is the last word. The commits and
# pull requests are the GitHub App OpenSpine SDLC's, with a token scoped
# to the one consumer: a push made with GITHUB_TOKEN starts no workflow in
# the consumer, and the App's does, so the consumer's CI runs on it. The
# branch belongs to this workflow alone, which is why it is force-pushed.
#
# Where the variable SDLC_APP_ID is not set, the plan says in the run's
# summary what the owner sets up (README.md, "The owner's one-time setup
# for the sync") and the sync is skipped, so the run stays green. Values
# reach a shell only through env:, never through an expression inside
# run:, so nothing a value holds runs as code. One sync runs at a time and
# a newer push waits for it rather than cancelling it, so a consumer's
# pull request is never left half made. The weekly run catches a push
# whose sync failed, or a consumer that moved its copy by hand.

on:
  push:
    branches: [main]
    paths:
      - "sdlc_protocol/**"
      - "ecosystem.json"
      - "scripts/vendor.py"
      - "scripts/sync.py"
      - "scripts/ecosystem.py"
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      enabled: ${{ steps.plan.outputs.enabled }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: List the consumers, and whether the App is set up
        id: plan
        env:
          APP_ID: ${{ vars.SDLC_APP_ID }}
        run: |
          echo "matrix=$(python3 scripts/sync.py matrix)" >> "$GITHUB_OUTPUT"
          if [ -n "$APP_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            python3 scripts/sync.py setup >> "$GITHUB_STEP_SUMMARY"
          fi

  sync:
    name: sync (${{ matrix.name }})
    needs: plan
    if: needs.plan.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      CONSUMER: ${{ matrix.repository }}
      AUTO_MERGE: ${{ matrix.auto_merge }}
      BRANCH: sdlc-protocol/sync
    steps:
      # The whole history, so the pull request's body can list the
      # library's commits since the one the consumer's copy names.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ vars.SDLC_APP_ID }}
          private-key: ${{ secrets.SDLC_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ matrix.name }}

      - uses: actions/checkout@v7
        with:
          repository: ${{ matrix.repository }}
          token: ${{ steps.app-token.outputs.token }}
          path: consumer

      - name: Vendor main into the consumer
        run: python3 scripts/vendor.py consumer --consumer "$CONSUMER"

      # The App's bot is the author, as GitHub shows the App's own pushes.
      - name: Who the App commits as
        id: bot
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          id="$(gh api "/users/${SLUG}[bot]" --jq .id)"
          echo "name=${SLUG}[bot]" >> "$GITHUB_OUTPUT"
          echo "email=${id}+${SLUG}[bot]@users.noreply.github.com" >> "$GITHUB_OUTPUT"

      - name: Open or update the consumer's pull request
        working-directory: consumer
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BOT_NAME: ${{ steps.bot.outputs.name }}
          BOT_EMAIL: ${{ steps.bot.outputs.email }}
        run: |
          sync="python3 $GITHUB_WORKSPACE/scripts/sync.py"
          if [ -z "$(git status --porcelain)" ]; then
            $sync summary --consumer "$CONSUMER" --state "up to date" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          base="$(git rev-parse --abbrev-ref HEAD)"
          $sync body . --consumer "$CONSUMER" > "$RUNNER_TEMP/body.md"
          $sync message . --consumer "$CONSUMER" > "$RUNNER_TEMP/message.txt"
          title="$($sync title . --consumer "$CONSUMER")"
          git config user.name "$BOT_NAME"
          git config user.email "$BOT_EMAIL"
          git checkout -q -B "$BRANCH"
          git add -A
          git commit -q -F "$RUNNER_TEMP/message.txt"
          git push --force origin "HEAD:refs/heads/$BRANCH"
          url="$(gh pr list --repo "$CONSUMER" --head "$BRANCH" --state open --json url --jq '.[0].url // ""')"
          if [ -n "$url" ]; then
            gh pr edit "$url" --title "$title" --body-file "$RUNNER_TEMP/body.md"
            state="updated"
          else
            url="$(gh pr create --repo "$CONSUMER" --base "$base" --head "$BRANCH" --title "$title" --body-file "$RUNNER_TEMP/body.md")"
            state="opened"
          fi
          merge=""
          if [ "$AUTO_MERGE" = "true" ]; then
            if gh pr merge "$url" --auto --merge; then
              merge="on"
            else
              merge="unavailable"
            fi
          fi
          $sync summary --consumer "$CONSUMER" --state "$state" --url "$url" --auto-merge "$merge" >> "$GITHUB_STEP_SUMMARY"
